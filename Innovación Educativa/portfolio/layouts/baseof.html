<!doctype html>
<html lang="{{ site.Language.Locale }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.subtitle }}{{ end }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
  <script>
    // Antes de pintar, para que no parpadee: aplica el tema guardado (si no hay, manda el del sistema)
    try { const t = localStorage.getItem("tema"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <a class="brand" href="{{ "" | relURL }}">{{ site.Title }}</a>
      <p class="subtitle">{{ site.Params.subtitle }}</p>
      <nav class="nav">
        <a href="{{ "" | relURL }}#indice"{{ if .IsHome }} aria-current="page"{{ end }}>Índice</a>
        <a href="{{ "presentacion/" | relURL }}"{{ if eq .RelPermalink ("presentacion/" | relURL) }} aria-current="page"{{ end }}>Presentación</a>
        <button class="theme-toggle" type="button" hidden></button>
      </nav>
    </header>
    <main>{{ block "main" . }}{{ end }}</main>
    <footer class="foot">{{ site.Params.author }} · {{ now.Year }}</footer>
  </div>
  <script>
    (() => {
      const btn = document.querySelector(".theme-toggle"), root = document.documentElement;
      const isDark = () => (root.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")) === "dark";
      const paint = () => { btn.textContent = isDark() ? "☀ Modo claro" : "☾ Modo oscuro"; };
      btn.addEventListener("click", () => {
        root.dataset.theme = isDark() ? "light" : "dark";
        try { localStorage.setItem("tema", root.dataset.theme); } catch (e) {}
        paint();
      });
      matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paint);
      paint();
      btn.hidden = false; // sin JS no se muestra un botón que no haría nada
    })();
  </script>
</body>
</html>
