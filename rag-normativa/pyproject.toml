[project]
name = "rag-normativa"
version = "0.1.0"
description = "RAG local con citas sobre normativa educativa, para Claude (MCP) y modelos de Ollama (CLI)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "mcp>=1.2,<2",
    "numpy>=1.26",
    "pymupdf>=1.24",
    "pyyaml>=6",
    "rank-bm25>=0.2.2",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rag-normativa = "rag_normativa.cli:main"
rag-normativa-mcp = "rag_normativa.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_normativa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
